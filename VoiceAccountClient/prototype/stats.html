<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>统计</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body class="prototype-page">
    <main class="phone">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-three-quarters"></i>
        </div>
      </div>
      <header class="app-header">
        <div>
          <p class="eyebrow">支出洞察</p>
          <h1>统计</h1>
        </div>
        <i class="fa-solid fa-calendar-days soft-text"></i>
      </header>
      <section class="content">
        <div class="segmented">
          <button class="segment active">月</button>
          <button class="segment">季度</button>
          <button class="segment">年</button>
        </div>

        <div class="card summary-card" style="margin-top: 14px;">
          <div class="summary-row">
            <span class="white-soft">5 月总支出</span>
            <span class="chip">31 天</span>
          </div>
          <div class="amount-xl">¥ 4,268.50</div>
          <div class="summary-row" style="margin-top: 16px;">
            <span class="white-soft">最高单日 ¥526</span>
            <span class="white-soft">餐饮占比 34%</span>
          </div>
        </div>

        <div class="card chart-card">
          <div class="row">
            <h2>趋势图</h2>
            <span class="soft-text">按周汇总</span>
          </div>
          <div class="bar-chart">
            <div class="bar-wrap"><div class="bar" style="height: 62px;"></div><span>第1周</span></div>
            <div class="bar-wrap"><div class="bar" style="height: 104px;"></div><span>第2周</span></div>
            <div class="bar-wrap"><div class="bar" style="height: 82px;"></div><span>第3周</span></div>
            <div class="bar-wrap"><div class="bar" style="height: 128px;"></div><span>第4周</span></div>
            <div class="bar-wrap"><div class="bar" style="height: 96px;"></div><span>第5周</span></div>
            <div class="bar-wrap"><div class="bar" style="height: 48px;"></div><span>今天</span></div>
          </div>
        </div>

        <div class="card chart-card">
          <div class="row">
            <h2>分布图</h2>
            <span class="soft-text">分类从高到低</span>
          </div>
          <div class="rank-list">
            <div class="rank-row"><span>餐饮</span><div class="track"><div class="fill" style="width: 86%; background: var(--orange);"></div></div><span>¥1452</span></div>
            <div class="rank-row"><span>购物</span><div class="track"><div class="fill" style="width: 68%; background: var(--purple);"></div></div><span>¥1120</span></div>
            <div class="rank-row"><span>居家</span><div class="track"><div class="fill" style="width: 47%; background: var(--blue);"></div></div><span>¥786</span></div>
            <div class="rank-row"><span>交通</span><div class="track"><div class="fill" style="width: 32%; background: var(--teal);"></div></div><span>¥520</span></div>
            <div class="rank-row"><span>学习</span><div class="track"><div class="fill" style="width: 22%; background: #475569;"></div></div><span>¥390</span></div>
          </div>
        </div>
      </section>
      <nav class="tabbar" aria-label="主导航">
        <div class="tab"><i class="fa-solid fa-receipt"></i><span>记账</span></div>
        <div class="tab active"><i class="fa-solid fa-chart-column"></i><span>统计</span></div>
        <div class="tab"><i class="fa-solid fa-clock-rotate-left"></i><span>历史</span></div>
        <div class="tab"><i class="fa-solid fa-gear"></i><span>设置</span></div>
      </nav>
    </main>
  </body>
</html>
