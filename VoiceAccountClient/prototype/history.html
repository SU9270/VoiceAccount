<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>历史</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
  </head>
  <body class="prototype-page">
    <main class="phone">
      <div class="status-bar">
        <span>9:41</span>
        <div class="status-icons">
          <i class="fa-solid fa-signal"></i>
          <i class="fa-solid fa-wifi"></i>
          <i class="fa-solid fa-battery-three-quarters"></i>
        </div>
      </div>
      <header class="app-header">
        <div>
          <p class="eyebrow">按天归档</p>
          <h1>历史</h1>
        </div>
        <i class="fa-solid fa-magnifying-glass soft-text"></i>
      </header>
      <section class="content">
        <div class="day-group">
          <div class="day-head">
            <h2>今天 · 5 月 30 日</h2>
            <span class="day-total">-¥318.50</span>
          </div>
          <div class="list">
            <div class="item">
              <div class="icon food"><i class="fa-solid fa-utensils"></i></div>
              <div><div class="item-title">午餐 · 日式简餐</div><div class="item-meta">12:26 · 餐饮</div></div>
              <div class="expense">-¥68</div>
            </div>
            <div class="item">
              <div class="icon traffic"><i class="fa-solid fa-taxi"></i></div>
              <div><div class="item-title">打车到公司</div><div class="item-meta">09:12 · 交通</div></div>
              <div class="expense">-¥42.5</div>
            </div>
          </div>
        </div>

        <div class="day-group">
          <div class="day-head">
            <h2>昨天 · 5 月 29 日</h2>
            <span class="day-total">-¥526.00</span>
          </div>
          <div class="list">
            <div class="item">
              <div class="icon home"><i class="fa-solid fa-house"></i></div>
              <div><div class="item-title">物业费</div><div class="item-meta">20:02 · 居家</div></div>
              <div class="expense">-¥360</div>
            </div>
            <div class="item">
              <div class="icon shop"><i class="fa-solid fa-shirt"></i></div>
              <div><div class="item-title">运动 T 恤</div><div class="item-meta">17:45 · 购物</div></div>
              <div class="expense">-¥166</div>
            </div>
          </div>
        </div>

        <div class="day-group">
          <div class="day-head">
            <h2>周四 · 5 月 28 日</h2>
            <span class="day-total">-¥214.00</span>
          </div>
          <div class="list">
            <div class="item">
              <div class="icon learn"><i class="fa-solid fa-book"></i></div>
              <div><div class="item-title">在线课程订阅</div><div class="item-meta">21:18 · 学习</div></div>
              <div class="expense">-¥199</div>
            </div>
            <div class="item">
              <div class="icon traffic"><i class="fa-solid fa-train-subway"></i></div>
              <div><div class="item-title">地铁</div><div class="item-meta">08:34 · 交通</div></div>
              <div class="expense">-¥15</div>
            </div>
          </div>
        </div>
      </section>
      <nav class="tabbar" aria-label="主导航">
        <div class="tab"><i class="fa-solid fa-receipt"></i><span>记账</span></div>
        <div class="tab"><i class="fa-solid fa-chart-column"></i><span>统计</span></div>
        <div class="tab active"><i class="fa-solid fa-clock-rotate-left"></i><span>历史</span></div>
        <div class="tab"><i class="fa-solid fa-gear"></i><span>设置</span></div>
      </nav>
    </main>
  </body>
</html>
